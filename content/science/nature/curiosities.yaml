title: Curiosidades da natureza
subtopic: Natureza
questions:
  - id: liquid-metal
    level: easy
    prompt: Qual metal é líquido na temperatura ambiente?
    choices:
      - Chumbo
      - Alumínio
      - Mercúrio
      - Ferro
    answer: Mercúrio
    explanation: >-
      O mercúrio derrete a cerca de -39 °C, então fica líquido no dia a dia. Por isso
      era usado em termômetros antigos, embora seja tóxico.
    learnMore:
      - title: Britannica, mercúrio
        url: https://www.britannica.com/science/mercury-chemical-element

  - id: octopus-hearts
    level: medium
    prompt: Quantos corações tem um polvo?
    choices:
      - Um
      - Dois
      - Três
      - Oito
    answer: Três
    explanation: >-
      Dois corações levam o sangue às brânquias e um o leva ao resto do corpo. E o
      sangue do polvo é azul, por causa do cobre.
    learnMore:
      - title: Britannica, cefalópodes
        url: https://www.britannica.com/animal/cephalopod/Form-and-function
      - title: National Geographic, por que o sangue dos animais tem tantas cores
        url: https://www.nationalgeographic.com/animals/article/animal-blood-comes-in-a-rainbow-of-colors

  - id: photosynthesis-gas
    level: easy
    prompt: Que gás as plantas absorvem do ar para fazer fotossíntese?
    choices:
      - Gás carbônico
      - Oxigênio
      - Nitrogênio
      - Hélio
    answer: Gás carbônico
    explanation: >-
      Com a luz do Sol, elas usam gás carbônico e água para fabricar açúcar, e liberam
      oxigênio no processo.
    learnMore:
      - title: National Geographic, fotossíntese
        url: https://education.nationalgeographic.org/resource/photosynthesis/

  - id: biggest-organ
    level: easy
    prompt: Qual é o maior órgão do corpo humano?
    choices:
      - O fígado
      - A pele
      - O pulmão
      - O intestino
    answer: A pele
    explanation: >-
      A pele de um adulto cobre de 1,5 a 2 m². Ela protege o corpo, ajuda a controlar a
      temperatura e nos dá o tato.
    learnMore:
      - title: Cleveland Clinic, pele
        url: https://my.clevelandclinic.org/health/body/10978-skin
      - title: Revisão científica sobre a pele (PMC)
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4403087/

  - id: blue-sky
    level: medium
    prompt: Por que o céu durante o dia é azul?
    choices:
      - Ele reflete o mar
      - O ar é azul
      - A luz azul se espalha mais
      - O Sol é azul
    answer: A luz azul se espalha mais
    explanation: >-
      A atmosfera espalha a luz azul do Sol bem mais que as outras cores. Por isso ela
      chega aos nossos olhos vinda de todo o céu.
    learnMore:
      - title: NASA Space Place, por que o céu é azul
        url: https://spaceplace.nasa.gov/blue-sky/en/

  - id: fastest-animal
    level: easy
    prompt: Qual é o animal mais rápido do mundo?
    choices:
      - Guepardo
      - Avestruz
      - Cavalo
      - Falcão-peregrino
    answer: Falcão-peregrino
    explanation: >-
      Mergulhando, o falcão-peregrino passa de 300 km/h. O guepardo é o mais rápido em
      terra, com cerca de 100 km/h.
    learnMore:
      - title: Britannica, falcão-peregrino
        url: https://www.britannica.com/animal/peregrine-falcon
      - title: Britannica, os animais mais rápidos da Terra
        url: https://www.britannica.com/list/the-fastest-animals-on-earth

  - id: adult-bones
    level: medium
    prompt: Quantos ossos tem um adulto?
    choices:
      - '106'
      - '206'
      - '306'
      - '406'
    answer: '206'
    explanation: >-
      Os bebês nascem com entre 270 e 300 ossos. Vários se juntam durante o crescimento,
      até sobrarem 206.
    learnMore:
      - title: Cleveland Clinic, ossos do corpo humano
        url: https://my.clevelandclinic.org/health/body/25176-bones
      - title: Cleveland Clinic, quantos ossos tem um bebê
        url: https://health.clevelandclinic.org/how-many-bones-does-a-baby-have

  - id: air-gas
    level: medium
    prompt: Qual gás existe em maior quantidade no ar que respiramos?
    choices:
      - Oxigênio
      - Gás carbônico
      - Nitrogênio
    answer: Nitrogênio
    explanation: >-
      O ar tem cerca de 78% de nitrogênio e só 21% de oxigênio, que é o gás que o corpo
      aproveita para viver.
    learnMore:
      - title: NOAA, a atmosfera
        url: https://www.noaa.gov/jetstream/atmosphere

  - id: bats-blind
    type: true-false
    level: easy
    prompt: Os morcegos são cegos.
    answer: false
    explanation: >-
      Nenhum morcego é cego: todos enxergam. Muitos também usam o eco dos próprios gritos
      para se guiar no escuro (a ecolocalização), e dali vem o mito.
    learnMore:
      - title: Bat Conservation International, "cego como um morcego" não existe
        url: https://www.batcon.org/blind-as-a-bat-no-such-thing/
      - title: Serviço de Parques dos EUA, mitos sobre morcegos
        url: https://www.nps.gov/subjects/bats/myth-busters.htm

  - id: tallest-animal
    level: easy
    prompt: Qual é o animal mais alto do mundo?
    choices:
      - Elefante
      - Girafa
      - Avestruz
      - Camelo
    answer: Girafa
    explanation: >-
      Uma girafa adulta pode passar de 5 metros de altura, quase o dobro de uma porta. E
      mesmo com aquele pescoço enorme, ela tem só sete vértebras nele, como a gente.
    learnMore:
      - title: Britannica, girafa
        url: https://www.britannica.com/animal/giraffe

  - id: blue-whale
    level: easy
    prompt: Qual é o maior animal que já existiu na Terra, contando até os dinossauros?
    choices:
      - Tiranossauro
      - Baleia-azul
      - Elefante-africano
      - Tubarão-baleia
    answer: Baleia-azul
    explanation: >-
      A baleia-azul passa de 30 metros e pode pesar mais de 150 toneladas. Nenhum dinossauro
      conhecido chegou a tanto, e ela ainda vive nos oceanos hoje.
    learnMore:
      - title: NOAA Fisheries, baleia-azul
        url: https://www.fisheries.noaa.gov/species/blue-whale

  - id: spider-legs
    level: easy
    prompt: Quantas patas tem uma aranha?
    choices:
      - Seis
      - Oito
      - Dez
      - Doze
    answer: Oito
    explanation: >-
      Aranhas têm oito patas e não são insetos: são aracnídeos, como os escorpiões. Os
      insetos, como formigas e abelhas, têm seis.
    learnMore:
      - title: Britannica, aranha
        url: https://www.britannica.com/animal/spider-arachnid

  - id: penguin-bird
    type: true-false
    level: easy
    prompt: O pinguim é uma ave, mesmo sem saber voar.
    answer: true
    explanation: >-
      O pinguim tem penas, bico e bota ovos, como toda ave. As asas viraram nadadeiras:
      ele não voa no ar, mas "voa" debaixo d'água.
    learnMore:
      - title: Britannica, pinguim
        url: https://www.britannica.com/animal/penguin

  - id: tardigrade
    level: hard
    prompt: Qual animalzinho, menor que 1 milímetro, já sobreviveu do lado de fora de uma nave, no espaço?
    choices:
      - Formiga
      - Pulga
      - Tardígrado
      - Barata
    answer: Tardígrado
    explanation: >-
      O tardígrado, o "urso-d'água", seca, se encolhe e quase para de viver quando o
      ambiente fica ruim. Assim ele aguenta frio extremo, falta de água e até o vácuo do
      espaço, como mostrou um experimento em 2007.
    learnMore:
      - title: Britannica, tardígrado
        url: https://www.britannica.com/animal/tardigrade

  - id: honey-forever
    type: true-false
    level: medium
    prompt: Mel bem fechado pode durar milhares de anos sem estragar.
    answer: true
    explanation: >-
      O mel tem pouquíssima água e é ácido, então micróbios não conseguem viver nele.
      Arqueólogos já acharam potes de mel ainda comestível em tumbas do Egito antigo.
    learnMore:
      - title: Smithsonian Magazine, por que o mel não estraga
        url: https://www.smithsonianmag.com/science-nature/the-science-behind-honeys-eternal-shelf-life-1218690/

  - id: bamboo-grass
    level: medium
    prompt: O bambu, uma das plantas que crescem mais rápido no mundo, é parente de qual destas?
    choices:
      - Pinheiro
      - Grama
      - Cacto
      - Samambaia
    answer: Grama
    explanation: >-
      Apesar de parecer árvore, o bambu é uma gramínea, da mesma família da grama, do milho
      e do arroz. Algumas espécies crescem quase um metro em um só dia.
    learnMore:
      - title: Britannica, bambu
        url: https://www.britannica.com/plant/bamboo

  - id: chlorophyll
    type: fill-blank
    level: easy
    prompt: As folhas das plantas são verdes por causa da ___.
    choices:
      - clorofila
      - seiva
      - celulose
      - glicose
    answer: clorofila
    explanation: >-
      A clorofila captura a luz do Sol para a fotossíntese. Ela aproveita bem a luz azul e
      a vermelha e devolve a verde, que é a cor que chega aos nossos olhos.
    learnMore:
      - title: Britannica, clorofila
        url: https://www.britannica.com/science/chlorophyll

  - id: flamingo-pink
    level: medium
    prompt: Por que os flamingos são cor-de-rosa?
    choices:
      - Por causa da comida
      - Por causa do sol forte
      - Já nascem assim
      - Para assustar predadores
    answer: Por causa da comida
    explanation: >-
      Os flamingos comem algas e pequenos camarões cheios de pigmento. Os filhotes nascem
      com penugem branca e vão ficando cor-de-rosa com os anos, conforme se alimentam.
    learnMore:
      - title: Zoológico Nacional Smithsonian, flamingo
        url: https://nationalzoo.si.edu/animals/american-flamingo

  - id: shark-skeleton
    level: hard
    prompt: Do que é feito o esqueleto de um tubarão?
    choices:
      - Osso, como o nosso
      - Cartilagem
      - Concha
      - Ele não tem esqueleto
    answer: Cartilagem
    explanation: >-
      O esqueleto do tubarão é de cartilagem, o mesmo material flexível da ponta do nosso
      nariz e das orelhas. Ele é mais leve que osso e ajuda o tubarão a nadar com agilidade.
    learnMore:
      - title: Britannica, tubarão
        url: https://www.britannica.com/animal/shark

  - id: earth-water
    level: medium
    prompt: Quanto da superfície da Terra é coberto por água?
    choices:
      - Cerca de 30%
      - Cerca de 50%
      - Cerca de 70%
      - Cerca de 90%
    answer: Cerca de 70%
    explanation: >-
      Cerca de 71% da superfície é água, e quase toda ela está nos oceanos, salgada. A água
      doce de rios e lagos é só uma pontinha desse total.
    learnMore:
      - title: USGS, quanta água existe na Terra
        url: https://www.usgs.gov/special-topics/water-science-school/science/how-much-water-there-earth
