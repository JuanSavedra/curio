title: Curiosidades da natureza
subtopic: Natureza
questions:
  - id: liquid-metal
    level: easy
    prompt: Qual metal é líquido na temperatura ambiente?
    choices:
      - Chumbo
      - Alumínio
      - Mercúrio
      - Ferro
    answer: Mercúrio
    explanation: >-
      O mercúrio derrete a cerca de -39 °C, então fica líquido no dia a dia. Por isso
      era usado em termômetros antigos, embora seja tóxico.
    learnMore:
      - title: Britannica, mercúrio
        url: https://www.britannica.com/science/mercury-chemical-element

  - id: octopus-hearts
    level: medium
    prompt: Quantos corações tem um polvo?
    choices:
      - Um
      - Dois
      - Três
      - Oito
    answer: Três
    explanation: >-
      Dois corações levam o sangue às brânquias e um o leva ao resto do corpo. E o
      sangue do polvo é azul, por causa do cobre.
    learnMore:
      - title: Britannica, cefalópodes
        url: https://www.britannica.com/animal/cephalopod/Form-and-function
      - title: National Geographic, por que o sangue dos animais tem tantas cores
        url: https://www.nationalgeographic.com/animals/article/animal-blood-comes-in-a-rainbow-of-colors

  - id: photosynthesis-gas
    level: easy
    prompt: Que gás as plantas absorvem do ar para fazer fotossíntese?
    choices:
      - Gás carbônico
      - Oxigênio
      - Nitrogênio
      - Hélio
    answer: Gás carbônico
    explanation: >-
      Com a luz do Sol, elas usam gás carbônico e água para fabricar açúcar, e liberam
      oxigênio no processo.
    learnMore:
      - title: National Geographic, fotossíntese
        url: https://education.nationalgeographic.org/resource/photosynthesis/

  - id: biggest-organ
    level: easy
    prompt: Qual é o maior órgão do corpo humano?
    choices:
      - O fígado
      - A pele
      - O pulmão
      - O intestino
    answer: A pele
    explanation: >-
      A pele de um adulto cobre de 1,5 a 2 m². Ela protege o corpo, ajuda a controlar a
      temperatura e nos dá o tato.
    learnMore:
      - title: Cleveland Clinic, pele
        url: https://my.clevelandclinic.org/health/body/10978-skin
      - title: Revisão científica sobre a pele (PMC)
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4403087/

  - id: blue-sky
    level: medium
    prompt: Por que o céu durante o dia é azul?
    choices:
      - Ele reflete o mar
      - O ar é azul
      - A luz azul se espalha mais
      - O Sol é azul
    answer: A luz azul se espalha mais
    explanation: >-
      A atmosfera espalha a luz azul do Sol bem mais que as outras cores. Por isso ela
      chega aos nossos olhos vinda de todo o céu.
    learnMore:
      - title: NASA Space Place, por que o céu é azul
        url: https://spaceplace.nasa.gov/blue-sky/en/

  - id: fastest-animal
    level: easy
    prompt: Qual é o animal mais rápido do mundo?
    choices:
      - Guepardo
      - Avestruz
      - Cavalo
      - Falcão-peregrino
    answer: Falcão-peregrino
    explanation: >-
      Mergulhando, o falcão-peregrino passa de 300 km/h. O guepardo é o mais rápido em
      terra, com cerca de 100 km/h.
    learnMore:
      - title: Britannica, falcão-peregrino
        url: https://www.britannica.com/animal/peregrine-falcon
      - title: Britannica, os animais mais rápidos da Terra
        url: https://www.britannica.com/list/the-fastest-animals-on-earth

  - id: adult-bones
    level: medium
    prompt: Quantos ossos tem um adulto?
    choices:
      - '106'
      - '206'
      - '306'
      - '406'
    answer: '206'
    explanation: >-
      Os bebês nascem com entre 270 e 300 ossos. Vários se juntam durante o crescimento,
      até sobrarem 206.
    learnMore:
      - title: Cleveland Clinic, ossos do corpo humano
        url: https://my.clevelandclinic.org/health/body/25176-bones
      - title: Cleveland Clinic, quantos ossos tem um bebê
        url: https://health.clevelandclinic.org/how-many-bones-does-a-baby-have

  - id: air-gas
    level: medium
    prompt: Qual gás existe em maior quantidade no ar que respiramos?
    choices:
      - Oxigênio
      - Gás carbônico
      - Nitrogênio
    answer: Nitrogênio
    explanation: >-
      O ar tem cerca de 78% de nitrogênio e só 21% de oxigênio, que é o gás que o corpo
      aproveita para viver.
    learnMore:
      - title: NOAA, a atmosfera
        url: https://www.noaa.gov/jetstream/atmosphere

  - id: bats-blind
    type: true-false
    level: easy
    prompt: Os morcegos são cegos.
    answer: false
    explanation: >-
      Nenhum morcego é cego: todos enxergam. Muitos também usam o eco dos próprios gritos
      para se guiar no escuro (a ecolocalização), e dali vem o mito.
    learnMore:
      - title: Bat Conservation International, "cego como um morcego" não existe
        url: https://www.batcon.org/blind-as-a-bat-no-such-thing/
      - title: Serviço de Parques dos EUA, mitos sobre morcegos
        url: https://www.nps.gov/subjects/bats/myth-busters.htm
