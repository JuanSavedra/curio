title: Números curiosos
subtopic: Números
questions:
  - id: zero-even
    level: medium
    prompt: O zero é par ou ímpar?
    choices:
      - Par
      - Ímpar
      - Nem par nem ímpar
    answer: Par
    explanation: >-
      Um número é par quando dividido por 2 não deixa resto. Como 0 ÷ 2 = 0, com resto zero,
      o zero é par. Ele também fica entre −1 e 1, dois ímpares, como todo par.
    learnMore:
      - title: Britannica, o zero é par ou ímpar?
        url: https://www.britannica.com/story/is-zero-an-even-or-an-odd-number
      - title: Wolfram MathWorld, números pares
        url: https://mathworld.wolfram.com/EvenNumber.html

  - id: sum-to-hundred
    level: medium
    prompt: Quanto dá 1 + 2 + 3 + … + 100?
    choices:
      - '1.000'
      - '5.000'
      - '5.050'
      - '10.100'
    answer: '5.050'
    explanation: >-
      Junte as pontas: 1 + 100 = 101, 2 + 99 = 101, e assim por diante. São 50 pares
      de 101, então a soma é 50 × 101 = 5.050. Dizem que o matemático Gauss descobriu
      esse truque ainda criança, na escola.
    learnMore:
      - title: NRICH (Universidade de Cambridge), o esperto Carl
        url: https://nrich.maths.org/articles/clever-carl
      - title: MacTutor, biografia de Gauss
        url: https://mathshistory.st-andrews.ac.uk/Biographies/Gauss/

  - id: root-of-two
    level: hard
    prompt: Dá para escrever $\sqrt{2}$ como uma fração de dois números inteiros?
    choices:
      - Sim
      - Não
    answer: Não
    explanation: >-
      $\sqrt{2}$ é irracional: suas casas decimais (1,41421356…) nunca terminam nem
      se repetem. Os gregos antigos já sabiam disso, e a descoberta teria incomodado bastante
      os seguidores de Pitágoras.
    learnMore:
      - title: Wolfram MathWorld, a constante de Pitágoras
        url: https://mathworld.wolfram.com/PythagorassConstant.html
      - title: MacTutor, os números reais
        url: https://mathshistory.st-andrews.ac.uk/HistTopics/Real_numbers_1/

  - id: infinite-nines
    level: hard
    prompt: O número 0,999…, com noves que nunca acabam, é igual a quanto?
    choices:
      - Um pouquinho menos que 1
      - Exatamente 1
      - Não dá para saber
    answer: Exatamente 1
    explanation: >-
      Pense que $\frac{1}{3} = 0{,}333\ldots$ Multiplicando os dois lados por 3, fica
      $1 = 0{,}999\ldots$ São dois jeitos diferentes de escrever o mesmo número.
    learnMore:
      - title: Scientific American, 0,999… é igual a 1?
        url: https://www.scientificamerican.com/article/mathematicians-cant-agree-on-whether-0-999-equals-1/

  - id: birthday
    level: hard
    prompt: Numa sala com 23 pessoas, qual a chance de duas terem o mesmo aniversário?
    choices:
      - Menos de 10%
      - Cerca de 25%
      - Mais de 50%
    answer: Mais de 50%
    explanation: >-
      Parece pouco, mas o que conta são os pares de pessoas, e 23 pessoas formam 253 pares.
      A chance passa de 50%, e com 70 pessoas já chega a 99,9%. É o famoso paradoxo do aniversário.
    learnMore:
      - title: Britannica, o problema do aniversário
        url: https://www.britannica.com/science/birthday-problem
      - title: Scientific American, probabilidade e o paradoxo do aniversário
        url: https://www.scientificamerican.com/article/bring-science-home-probability-birthday-paradox/

  - id: folded-paper
    level: medium
    prompt: Se desse para dobrar uma folha de papel ao meio 42 vezes, até onde chegaria a pilha?
    choices:
      - Até o teto
      - Até o topo do Everest
      - Até a Lua
    answer: Até a Lua
    explanation: >-
      Cada dobra dobra a espessura. Uma folha de 0,1 mm dobrada 42 vezes fica com
      $0{,}1 \times 2^{42}$ mm, uns 440 mil quilômetros, mais que a distância até a Lua.
      Na prática é impossível: o recorde é de 12 dobras, e com uma tira de papel de 1,2 km.
    learnMore:
      - title: Scientific American, quantas dobras levam à Lua?
        url: https://www.scientificamerican.com/article/how-many-paper-folds-would-get-you-to-the-moon/
      - title: Wolfram MathWorld, dobras
        url: https://mathworld.wolfram.com/Folding.html

  - id: what-is-pi
    level: easy
    prompt: O que é o número $\pi$?
    choices:
      - O contorno de qualquer círculo dividido pelo seu diâmetro
      - Um número inventado para arredondar contas
      - O maior número primo conhecido
    answer: O contorno de qualquer círculo dividido pelo seu diâmetro
    explanation: >-
      Não importa o tamanho do círculo: o contorno dividido pelo diâmetro sempre dá
      $\pi \approx 3{,}14159$. Ele tem infinitas casas decimais e ganhou até um dia próprio,
      14 de março (3/14, no jeito americano de escrever datas).
    learnMore:
      - title: NASA JPL, como os cientistas usam o pi
        url: https://www.jpl.nasa.gov/news/on-pi-day-how-scientists-use-this-number/

  - id: which-is-prime
    level: medium
    prompt: Qual destes números é primo?
    choices:
      - '51'
      - '57'
      - '91'
      - '97'
    answer: '97'
    explanation: >-
      Os outros enganam bem: 51 = 3 × 17, 57 = 3 × 19 e 91 = 7 × 13.
      Já o 97 só é divisível por 1 e por ele mesmo. Uma dica: se a soma dos algarismos
      é múltiplo de 3, o número também é.
    learnMore:
      - title: Britannica, números primos
        url: https://www.britannica.com/science/prime-number
      - title: NRICH (Universidade de Cambridge), testes de divisibilidade
        url: https://nrich.maths.org/articles/divisibility-tests

  - id: only-even-prime
    type: true-false
    level: medium
    prompt: O 2 é o único número primo par.
    answer: true
    explanation: >-
      Todo número par maior que 2 pode ser dividido por 2, então tem outros divisores além
      de 1 e dele mesmo, e não é primo. Por isso o 2 é o único primo par.
    learnMore:
      - title: Wolfram MathWorld, o primo par
        url: https://mathworld.wolfram.com/EvenPrime.html
      - title: Britannica para estudantes, números primos
        url: https://kids.britannica.com/students/article/prime/651327

  - id: triangle-angles
    type: fill-blank
    level: medium
    prompt: A soma dos ângulos internos de um triângulo é ___ graus.
    choices:
      - '90'
      - '180'
      - '270'
      - '360'
    answer: '180'
    explanation: >-
      Em qualquer triângulo, os três ângulos juntos dão 180 graus. Isso vale na geometria
      plana, a das folhas de papel e do caderno.
    learnMore:
      - title: Britannica, triângulo
        url: https://www.britannica.com/science/triangle-mathematics
      - title: Wolfram MathWorld, triângulo
        url: https://mathworld.wolfram.com/Triangle.html

  - id: one-not-prime
    type: true-false
    level: easy
    prompt: O número 1 é primo.
    answer: false
    explanation: >-
      Um primo tem exatamente dois divisores: o 1 e ele mesmo. O 1 só tem um divisor, então
      fica de fora. O primeiro primo é o 2.
    learnMore:
      - title: Wolfram MathWorld, número primo
        url: https://mathworld.wolfram.com/PrimeNumber.html

  - id: primes-never-end
    type: true-false
    level: medium
    prompt: Os números primos acabam em algum momento.
    answer: false
    explanation: >-
      Euclides provou, há mais de 2.300 anos, que sempre existe mais um primo. A ideia:
      multiplique todos os primos que você conhece e some 1. O resultado não se divide por
      nenhum deles, então algum primo novo aparece.
    learnMore:
      - title: Wolfram MathWorld, teoremas de Euclides
        url: https://mathworld.wolfram.com/EuclidsTheorems.html
      - title: MacTutor, a história dos números primos
        url: https://mathshistory.st-andrews.ac.uk/HistTopics/Prime_numbers/

  - id: largest-prime
    level: hard
    prompt: Em 2024, foi achado o maior número primo conhecido até então. Quantos algarismos ele tem?
    choices:
      - Cerca de 410
      - Cerca de 41 mil
      - Cerca de 41 milhões
      - Cerca de 41 bilhões
    answer: Cerca de 41 milhões
    explanation: >-
      É o $2^{136279841} - 1$, com 41.024.320 algarismos. Escrito à mão, encheria milhares de
      cadernos. Ele foi achado por Luke Durant, com ajuda de muitos computadores trabalhando
      juntos pela internet.
    learnMore:
      - title: GIMPS, anúncio do maior primo conhecido
        url: https://www.mersenne.org/primes/press/M136279841.html

  - id: perfect-number
    level: hard
    prompt: Um número é perfeito quando é igual à soma dos seus divisores, sem contar ele mesmo. Qual destes é perfeito?
    choices:
      - '6'
      - '8'
      - '10'
      - '12'
    answer: '6'
    explanation: >-
      Os divisores de 6 (sem ele) são 1, 2 e 3, e 1 + 2 + 3 = 6. O próximo perfeito é o 28.
      Eles são raros: abaixo de 10.000 só existem quatro (6, 28, 496 e 8.128).
    learnMore:
      - title: Wolfram MathWorld, número perfeito
        url: https://mathworld.wolfram.com/PerfectNumber.html

  - id: divisible-by-nine
    level: medium
    prompt: Como saber, sem fazer a conta, se um número é divisível por 9?
    choices:
      - Se termina em 9
      - Se a soma dos algarismos é divisível por 9
      - Se é ímpar
      - Se tem 9 algarismos
    answer: Se a soma dos algarismos é divisível por 9
    explanation: >-
      Em 1.836, por exemplo: 1 + 8 + 3 + 6 = 18, que é múltiplo de 9, então 1.836 também é
      (1.836 = 9 × 204). O mesmo truque vale para o 3.
    learnMore:
      - title: NRICH (Universidade de Cambridge), testes de divisibilidade
        url: https://nrich.maths.org/articles/divisibility-tests

  - id: odd-plus-odd
    type: true-false
    level: easy
    prompt: Somar dois números ímpares sempre dá um número par.
    answer: true
    explanation: >-
      Cada ímpar é um par com uma unidade sobrando. Juntando dois, as duas sobras formam mais
      um par: 3 + 5 = 8, 7 + 9 = 16.
    learnMore:
      - title: Wolfram MathWorld, números ímpares
        url: https://mathworld.wolfram.com/OddNumber.html

  - id: factorial
    level: hard
    prompt: Quanto é 5! (lê-se "cinco fatorial")?
    choices:
      - '5'
      - '25'
      - '120'
      - '3.125'
    answer: '120'
    explanation: >-
      O fatorial multiplica todos os números até ele: 5 × 4 × 3 × 2 × 1 = 120. É também o
      número de jeitos de enfileirar 5 pessoas. Cresce rápido: 10! já passa de 3 milhões.
    learnMore:
      - title: Wolfram MathWorld, fatorial
        url: https://mathworld.wolfram.com/Factorial.html

  - id: divide-by-zero
    level: medium
    prompt: Quanto dá 10 dividido por 0?
    choices:
      - '0'
      - '10'
      - Infinito
      - Não tem resultado
    answer: Não tem resultado
    explanation: >-
      Dividir é perguntar "que número vezes 0 dá 10?". Nenhum número serve, porque qualquer
      número vezes 0 dá 0. Por isso a divisão por zero não é definida.
    learnMore:
      - title: Wolfram MathWorld, divisão por zero
        url: https://mathworld.wolfram.com/DivisionbyZero.html

  - id: binary-two
    type: fill-blank
    level: hard
    prompt: No sistema binário, usado pelos computadores, o número 2 se escreve ___.
    choices:
      - '2'
      - '10'
      - '11'
      - '01'
    answer: '10'
    explanation: >-
      O binário só tem dois algarismos, 0 e 1. Contando: 1, 10 (dois), 11 (três), 100
      (quatro). Cada casa vale o dobro da anterior, como as nossas valem dez vezes mais.
    learnMore:
      - title: Wolfram MathWorld, binário
        url: https://mathworld.wolfram.com/Binary.html

  - id: percent-half
    type: fill-blank
    level: easy
    prompt: 50% de qualquer valor é a ___ dele.
    choices:
      - metade
      - terça parte
      - quarta parte
      - décima parte
    answer: metade
    explanation: >-
      "Por cento" quer dizer "a cada cem". 50% são 50 de cada 100, ou seja, a metade. Do
      mesmo jeito, 25% é a quarta parte e 10% é a décima.
    learnMore:
      - title: Wolfram MathWorld, porcentagem
        url: https://mathworld.wolfram.com/Percent.html
