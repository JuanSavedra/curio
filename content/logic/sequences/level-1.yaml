title: Sequências e padrões
subtopic: Sequências
questions:
  - id: doubling
    level: easy
    prompt: 'Qual número vem a seguir? 2, 4, 8, 16, …'
    choices:
      - '18'
      - '24'
      - '32'
      - '64'
    answer: '32'
    explanation: >-
      Cada número é o dobro do anterior: 16 × 2 = 32. Essas são as potências de 2,
      a base de como os computadores guardam informação.

  - id: fibonacci
    level: medium
    prompt: 'E nesta? 1, 1, 2, 3, 5, 8, …'
    choices:
      - '11'
      - '13'
      - '16'
    answer: '13'
    explanation: >-
      Cada número é a soma dos dois anteriores: 5 + 8 = 13. É a sequência de Fibonacci,
      que aparece nas espirais das sementes de girassol e das pinhas.
    learnMore:
      - title: Sequência de Fibonacci na Wikipédia
        url: https://pt.wikipedia.org/wiki/Sequ%C3%AAncia_de_Fibonacci

  - id: squares
    level: medium
    prompt: 'Qual número continua a sequência? 1, 4, 9, 16, 25, …'
    choices:
      - '30'
      - '35'
      - '36'
      - '49'
    answer: '36'
    explanation: >-
      São os quadrados: $1^2, 2^2, 3^2, 4^2, 5^2$. O próximo é $6^2 = 36$. Dá para desenhar
      cada um como um quadradinho de pontos, e é daí que vem o nome.

  - id: skipping-letters
    level: easy
    prompt: 'Qual letra vem depois? A, C, E, G, …'
    choices:
      - H
      - I
      - J
    answer: I
    explanation: >-
      A sequência pula uma letra de cada vez: A (pula B), C (pula D), E (pula F), G (pula H), I.

  - id: number-initials
    level: medium
    prompt: 'Que letra continua? U, D, T, Q, C, …'
    choices:
      - S
      - O
      - N
    answer: S
    explanation: >-
      São as iniciais de Um, Dois, Três, Quatro, Cinco… e Seis! Muitos desafios de lógica
      escondem algo que a gente usa todo dia.

  - id: month-initials
    level: easy
    prompt: 'E esta? J, F, M, A, M, J, …'
    choices:
      - J
      - A
      - S
    answer: J
    explanation: >-
      Janeiro, Fevereiro, Março, Abril, Maio, Junho… e Julho. Depois dele, a sequência
      continua com A de Agosto.

  - id: odd-differences
    level: hard
    prompt: 'Qual o próximo número? 3, 6, 11, 18, 27, …'
    choices:
      - '36'
      - '38'
      - '40'
      - '45'
    answer: '38'
    explanation: >-
      Olhe para a distância entre os números: +3, +5, +7, +9. São os ímpares em ordem,
      então o próximo salto é +11, e 27 + 11 = 38.

  - id: look-and-say
    level: hard
    prompt: 'Desafio: 1, 11, 21, 1211, 111221, …'
    choices:
      - '312211'
      - '1112221'
      - '122211'
    answer: '312211'
    explanation: >-
      Cada termo descreve o anterior em voz alta. "1" tem um 1, então vira 11. "11" tem dois 1,
      vira 21. Lendo 111221: três 1, dois 2, um 1, ou seja, 312211. É a sequência
      "olhe e diga", estudada pelo matemático John Conway.
