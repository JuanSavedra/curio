title: Recordes do planeta
subtopic: Mundo
questions:
  - id: biggest-country
    level: easy
    prompt: Qual é o maior país do mundo em área?
    choices:
      - Canadá
      - China
      - Rússia
      - Brasil
    answer: Rússia
    explanation: >-
      A Rússia tem mais de 17 milhões de km² e atravessa 11 fusos horários.
    learnMore:
      - title: Britannica, Rússia
        url: https://www.britannica.com/place/Russia
      - title: CIA World Factbook, Rússia
        url: https://www.cia.gov/the-world-factbook/about/archives/2022/countries/russia

  - id: biggest-river
    level: hard
    prompt: Qual rio leva mais água ao mar no mundo?
    choices:
      - Nilo
      - Amazonas
      - Mississippi
      - Yangtzé
    answer: Amazonas
    explanation: >-
      O Amazonas despeja nos oceanos algo entre 15% e 20% de toda a água doce que os rios
      do planeta levam ao mar, mais do que os nove maiores rios seguintes juntos.
    learnMore:
      - title: Britannica, fatos sobre o rio Amazonas
        url: https://www.britannica.com/facts/Amazon-River
      - title: NASA, a foz do Amazonas
        url: https://science.nasa.gov/photojournal/mouth-of-the-amazon/

  - id: australia-capital
    level: medium
    prompt: Qual é a capital da Austrália?
    choices:
      - Sydney
      - Melbourne
      - Perth
      - Camberra
    answer: Camberra
    explanation: >-
      Sydney é mais famosa, mas a capital é Camberra. Ela foi planejada no início do
      século XX para acabar com a disputa entre Sydney e Melbourne.
    learnMore:
      - title: Autoridade da Capital Nacional da Austrália, a escolha do local e do nome
        url: https://www.nca.gov.au/education/canberras-history/siting-and-naming-canberra
      - title: Museu Nacional da Austrália, a fundação de Camberra
        url: https://www.nma.gov.au/defining-moments/resources/founding-of-canberra

  - id: biggest-ocean
    level: easy
    prompt: Qual é o maior oceano da Terra?
    choices:
      - Atlântico
      - Pacífico
      - Índico
      - Ártico
    answer: Pacífico
    explanation: >-
      O Pacífico cobre quase um terço da superfície da Terra, mais do que toda a terra
      firme somada.
    learnMore:
      - title: NOAA, o tamanho do oceano Pacífico
        url: https://oceanexplorer.noaa.gov/ocean-fact/pacific-size/

  - id: brazil-states
    level: easy
    prompt: Quantos estados tem o Brasil?
    choices:
      - '24'
      - '26'
      - '27'
      - '28'
    answer: '26'
    explanation: >-
      São 26 estados mais o Distrito Federal, onde fica Brasília. Juntos formam 27
      unidades da federação.
    learnMore:
      - title: IBGE Educa, divisão político-administrativa e regional
        url: https://educa.ibge.gov.br/jovens/conheca-o-brasil/territorio/18310-divisao-politico-administrativa-e-regional.html

  - id: highest-peak
    level: easy
    prompt: Qual é o ponto mais alto da Terra?
    choices:
      - Monte Everest
      - K2
      - Kilimanjaro
      - Aconcágua
    answer: Monte Everest
    explanation: >-
      O Everest, no Himalaia, tem cerca de 8.849 metros acima do nível do mar. E ainda
      sobe alguns milímetros por ano.
    learnMore:
      - title: National Geographic, a nova altura do Everest
        url: https://www.nationalgeographic.com/science/article/new-height-of-mount-everest-announced-by-china-and-nepal
      - title: NOAA, o ponto mais distante do centro da Terra
        url: https://oceanservice.noaa.gov/facts/highestpoint.html

  - id: biggest-population
    level: medium
    prompt: Qual país tem a maior população do mundo?
    choices:
      - China
      - Estados Unidos
      - Índia
      - Indonésia
    answer: Índia
    explanation: >-
      A Índia passou a China por volta de 2023 e tem mais de 1,4 bilhão de habitantes.
    learnMore:
      - title: ONU, a Índia ultrapassa a China
        url: https://desapublications.un.org/policy-briefs/un-desa-policy-brief-no-153-india-overtakes-china-worlds-most-populous-country

  - id: biggest-hot-desert
    level: medium
    prompt: Qual é o maior deserto quente do mundo?
    choices:
      - Gobi
      - Kalahari
      - Atacama
      - Saara
    answer: Saara
    explanation: >-
      O Saara, no norte da África, é quase do tamanho dos Estados Unidos. O maior de
      todos é a Antártida, que é um deserto de gelo.
    learnMore:
      - title: Britannica, os maiores desertos do mundo
        url: https://www.britannica.com/topic/worlds-largest-deserts-2225895

  - id: brazil-borders
    type: true-false
    level: hard
    prompt: O Brasil faz fronteira com todos os países da América do Sul, menos o Chile e o Equador.
    answer: true
    explanation: >-
      O Brasil encosta em 9 países sul-americanos e ainda na Guiana Francesa, que é um
      território da França. Chile e Equador são os únicos que não têm fronteira com ele.
    learnMore:
      - title: Itamaraty, geografia do Brasil
        url: https://www.gov.br/mre/pt-br/embaixada-bogota/o-brasil/geografia
      - title: FUNAG, as fronteiras terrestres do Brasil
        url: https://www.gov.br/funag/pt-br/ipri/arquivos-ipri/arquivos-estatisticas/fronteiras-terrestres-brasil-13052015.pdf

  - id: brazil-ocean
    type: fill-blank
    level: easy
    prompt: O oceano que banha toda a costa do Brasil é o ___.
    choices:
      - Atlântico
      - Pacífico
      - Índico
      - Ártico
    answer: Atlântico
    explanation: >-
      A costa brasileira tem mais de 7 mil quilômetros, e toda ela é banhada pelo oceano
      Atlântico. O Brasil não tem litoral em nenhum outro oceano.
    learnMore:
      - title: Itamaraty, geografia do Brasil
        url: https://www.gov.br/mre/pt-br/embaixada-bogota/o-brasil/geografia

  - id: vatican
    level: easy
    prompt: Qual é o menor país do mundo?
    choices:
      - Mônaco
      - Vaticano
      - San Marino
      - Malta
    answer: Vaticano
    explanation: >-
      O Vaticano tem menos de meio quilômetro quadrado e fica dentro de Roma, na Itália.
      Ele é a sede da Igreja Católica e o lugar onde mora o papa.
    learnMore:
      - title: UNESCO, Cidade do Vaticano
        url: https://whc.unesco.org/en/list/286
      - title: CIA World Factbook, Vaticano
        url: https://www.cia.gov/the-world-factbook/countries/holy-see-vatican-city/

  - id: greenland
    level: easy
    prompt: Qual é a maior ilha do mundo?
    choices:
      - Madagascar
      - Groenlândia
      - Bornéu
      - Islândia
    answer: Groenlândia
    explanation: >-
      A Groenlândia fica perto do polo Norte e quase toda ela é coberta por uma camada de
      gelo. A Austrália é maior, mas costuma ser contada como continente, não como ilha.
    learnMore:
      - title: CIA World Factbook, Groenlândia
        url: https://www.cia.gov/the-world-factbook/countries/greenland/

  - id: coldest-place
    type: true-false
    level: easy
    prompt: A temperatura mais fria já medida na Terra foi no polo Norte.
    answer: false
    explanation: >-
      Foi na Antártida, perto do polo Sul: −89,2 °C, na estação russa Vostok, em 1983. A
      Antártida é mais fria que o Ártico porque é um continente alto e coberto de gelo,
      enquanto o polo Norte fica sobre o mar.
    learnMore:
      - title: Organização Meteorológica Mundial, a temperatura mais baixa do mundo
        url: https://wmo.asu.edu/content/world-lowest-temperature

  - id: mariana-trench
    level: medium
    prompt: Onde fica o ponto mais fundo dos oceanos?
    choices:
      - Na Fossa das Marianas, no Pacífico
      - No meio do Atlântico
      - Perto do polo Norte
      - No mar Mediterrâneo
    answer: Na Fossa das Marianas, no Pacífico
    explanation: >-
      O ponto mais fundo, o Abismo Challenger, tem uns 10.935 metros. Se o Everest fosse
      colocado lá dentro, o topo ainda ficaria mais de 2 km debaixo d'água.
    learnMore:
      - title: NOAA, qual a profundidade do oceano
        url: https://oceanservice.noaa.gov/facts/oceandepth.html

  - id: caspian-sea
    level: medium
    prompt: Qual é o maior lago do mundo, tão grande que é chamado de mar?
    choices:
      - Mar Morto
      - Mar Cáspio
      - Lago Vitória
      - Mar Vermelho
    answer: Mar Cáspio
    explanation: >-
      O Cáspio, entre a Europa e a Ásia, cobre uns 371 mil km², mais que o estado de Goiás.
      Ele não tem saída para o oceano e perde água só pela evaporação, por isso é salgado.
    learnMore:
      - title: NASA Earth Observatory, mar Cáspio
        url: https://earthobservatory.nasa.gov/images/44253/caspian-sea

  - id: dead-sea
    level: medium
    prompt: Qual é o ponto mais baixo em terra firme do planeta?
    choices:
      - O mar Morto
      - O vale da Morte
      - A Holanda
      - O deserto do Saara
    answer: O mar Morto
    explanation: >-
      A margem do mar Morto fica mais de 400 metros abaixo do nível do mar. A água é tão
      salgada que quem entra boia sem esforço, e quase nenhum ser vivo aguenta viver nela.
    learnMore:
      - title: NASA JPL, o mar Morto
        url: https://www.jpl.nasa.gov/images/pia01916-the-dead-sea

  - id: atacama
    type: fill-blank
    level: medium
    prompt: O deserto mais seco do mundo, fora as regiões polares, é o deserto do ___, no Chile.
    choices:
      - Atacama
      - Saara
      - Gobi
      - Kalahari
    answer: Atacama
    explanation: >-
      Em algumas partes do Atacama quase nunca chove. A cordilheira dos Andes de um lado e
      uma corrente fria do oceano do outro barram a umidade.
    learnMore:
      - title: Wikipédia, deserto do Atacama
        url: https://pt.wikipedia.org/wiki/Deserto_do_Atacama

  - id: angel-falls
    level: hard
    prompt: Em que país fica o Salto Ángel, a cachoeira mais alta do mundo?
    choices:
      - Brasil
      - Venezuela
      - Canadá
      - Noruega
    answer: Venezuela
    explanation: >-
      A água cai de quase 1.000 metros do alto de um tepui, uma montanha de topo achatado,
      no Parque Nacional Canaima. É mais de dez vezes a altura das Cataratas do Iguaçu.
    learnMore:
      - title: UNESCO, Parque Nacional Canaima
        url: https://whc.unesco.org/en/list/701

  - id: baikal
    level: hard
    prompt: O lago Baikal, na Rússia, guarda sozinho cerca de quanto da água doce líquida da superfície da Terra?
    choices:
      - 1%
      - 5%
      - 20%
      - 50%
    answer: 20%
    explanation: >-
      O Baikal é o lago mais fundo (mais de 1.600 metros) e mais antigo do mundo, com uns 25
      milhões de anos. Por isso ele junta tanta água: um quinto de toda a água doce que não
      está congelada.
    learnMore:
      - title: UNESCO, lago Baikal
        url: https://whc.unesco.org/en/list/754

  - id: indonesia-islands
    level: hard
    prompt: A Indonésia é um país formado por quantas ilhas, mais ou menos?
    choices:
      - Umas 50
      - Umas 500
      - Mais de 17 mil
      - Mais de 1 milhão
    answer: Mais de 17 mil
    explanation: >-
      São mais de 17 mil ilhas espalhadas entre a Ásia e a Oceania. Muitas são pequenas e
      não têm moradores.
    learnMore:
      - title: CIA World Factbook, Indonésia
        url: https://www.cia.gov/the-world-factbook/countries/indonesia/
