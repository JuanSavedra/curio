title: Viagens ao espaço
subtopic: Exploração espacial
questions:
  - id: sputnik
    level: medium
    prompt: Qual foi o primeiro satélite artificial a dar voltas na Terra, em 1957?
    choices:
      - Sputnik 1
      - Apollo 11
      - Hubble
      - Voyager 1
    answer: Sputnik 1
    explanation: >-
      A União Soviética lançou o Sputnik em 4 de outubro de 1957. Era uma bola de metal do
      tamanho de uma bola de praia, que mandava um bipe de rádio. Ali começou a corrida
      espacial.
    learnMore:
      - title: NASA, Sputnik e a origem da era espacial
        url: https://www.nasa.gov/history/sputnik/

  - id: laika
    level: medium
    prompt: Quem foi Laika, lançada ao espaço em 1957?
    choices:
      - A primeira mulher astronauta
      - A primeira cadela a dar voltas na Terra
      - Um robô soviético
      - O nome de um foguete
    answer: A primeira cadela a dar voltas na Terra
    explanation: >-
      Laika era uma cadela de rua de Moscou e voou na Sputnik 2. Ela foi o primeiro animal
      em órbita, mas a nave não tinha como voltar, e ela não sobreviveu. Sua viagem mostrou
      que um ser vivo aguentava o lançamento.
    learnMore:
      - title: Scientific American, lembrando a viagem de Laika
        url: https://www.scientificamerican.com/article/remembering-laika-the-dog-s-trip-to-space-57-years-later/

  - id: gagarin
    level: easy
    prompt: Quem foi o primeiro ser humano a ir ao espaço, em 1961?
    choices:
      - Neil Armstrong
      - Yuri Gagarin
      - Buzz Aldrin
      - Marcos Pontes
    answer: Yuri Gagarin
    explanation: >-
      O russo Yuri Gagarin deu uma volta completa na Terra a bordo da Vostok 1, em 12 de
      abril de 1961. A viagem toda durou 108 minutos.
    learnMore:
      - title: NASA, Yuri Gagarin, o primeiro humano no espaço
        url: https://science.nasa.gov/resource/yuri-gagarin-first-human-in-space

  - id: tereshkova
    type: fill-blank
    level: medium
    prompt: A primeira mulher a ir ao espaço, em 1963, foi a russa Valentina ___.
    choices:
      - Tereshkova
      - Gagarina
      - Curie
      - Lovelace
    answer: Tereshkova
    explanation: >-
      Valentina Tereshkova voou sozinha na Vostok 6 e passou quase três dias em órbita. Antes,
      ela era operária numa fábrica de tecidos e saltava de paraquedas por hobby.
    learnMore:
      - title: Agência Espacial Europeia, a primeira mulher no espaço
        url: https://esa.int/About_Us/ESA_history/50_years_of_humans_in_space/First_woman_in_space_Valentina

  - id: moon-walkers
    level: hard
    prompt: Quantas pessoas já andaram na Lua?
    choices:
      - '2'
      - '6'
      - '12'
      - '24'
    answer: '12'
    explanation: >-
      Foram 12 astronautas americanos, em seis missões Apollo, de 1969 a 1972. Depois disso,
      ninguém mais pisou lá.
    learnMore:
      - title: NASA, as missões Apollo
        url: https://www.nasa.gov/the-apollo-program/

  - id: marcos-pontes
    level: medium
    prompt: Quem foi o primeiro astronauta brasileiro a ir ao espaço, em 2006?
    choices:
      - Santos-Dumont
      - Marcos Pontes
      - César Lattes
      - Ayrton Senna
    answer: Marcos Pontes
    explanation: >-
      O tenente-coronel da Aeronáutica Marcos Pontes passou uma semana na Estação Espacial
      Internacional. A missão se chamou Centenário, em homenagem aos 100 anos do voo do
      14-bis.
    learnMore:
      - title: Agência FAPESP, tem brasileiro no espaço
        url: https://agencia.fapesp.br/tem-brasileiro-no-espaco/5281

  - id: iss-orbit
    type: true-false
    level: medium
    prompt: A Estação Espacial Internacional dá uma volta completa na Terra a cada uns 90 minutos.
    answer: true
    explanation: >-
      Ela viaja a uns 28 mil km/h, cerca de 400 km acima de nós. Assim, os astronautas veem uns
      16 nasceres e pores do sol por dia. Às vezes dá até para vê-la cruzando o céu à noite.
    learnMore:
      - title: NASA, a Estação Espacial em números
        url: https://www.nasa.gov/international-space-station/space-station-facts-and-figures/

  - id: floating-gravity
    type: true-false
    level: hard
    prompt: Os astronautas flutuam na estação espacial porque lá em cima não existe gravidade.
    answer: false
    explanation: >-
      A gravidade lá ainda é quase 90% da que sentimos aqui. Eles flutuam porque a estação e
      tudo dentro dela estão caindo em volta da Terra o tempo todo, rápido o bastante para
      nunca chegar ao chão.
    learnMore:
      - title: NASA, o que é microgravidade
        url: https://www.nasa.gov/learning-resources/for-kids-and-students/what-is-microgravity-grades-5-8/

  - id: voyager-1
    level: hard
    prompt: Qual é o objeto feito por humanos que está mais longe da Terra?
    choices:
      - O telescópio Hubble
      - A sonda Voyager 1
      - A Estação Espacial Internacional
      - O robô Perseverance
    answer: A sonda Voyager 1
    explanation: >-
      Lançada em 1977, a Voyager 1 passou por Júpiter e Saturno e, em 2012, saiu da bolha do
      Sol para o espaço entre as estrelas. Ela leva um disco de ouro com sons e imagens da
      Terra.
    learnMore:
      - title: NASA, Voyager 1
        url: https://science.nasa.gov/mission/voyager/voyager-1/

  - id: perseverance
    level: medium
    prompt: Como se chama o robô da NASA que explora Marte desde 2021 e levou junto um pequeno helicóptero?
    choices:
      - Curiosity
      - Perseverance
      - Sputnik
      - Hubble
    answer: Perseverance
    explanation: >-
      O Perseverance procura sinais de vida antiga em Marte e guarda amostras de rocha. O
      helicóptero Ingenuity, que veio com ele, foi a primeira máquina a voar com motor em
      outro planeta.
    learnMore:
      - title: NASA, missão Perseverance
        url: https://science.nasa.gov/mission/mars-2020-perseverance/

  - id: cosmonaut
    type: fill-blank
    level: easy
    prompt: Os astronautas da Rússia costumam ser chamados de ___.
    choices:
      - cosmonautas
      - argonautas
      - aeronautas
      - pilotos solares
    answer: cosmonautas
    explanation: >-
      "Cosmonauta" junta cosmo, o universo, e nauta, navegante. "Astronauta" é parecido:
      navegante dos astros. As duas palavras falam da mesma profissão.
    learnMore:
      - title: Priberam, cosmonauta
        url: https://dicionario.priberam.org/cosmonauta

  - id: hubble
    level: medium
    prompt: Em que ano o telescópio espacial Hubble foi lançado?
    choices:
      - '1969'
      - '1990'
      - '2010'
      - '2021'
    answer: '1990'
    explanation: >-
      Lá de cima, sem o ar da Terra atrapalhando, o Hubble tira fotos muito nítidas do
      universo. Mais de 30 anos depois do lançamento, ele mudou muito do que sabemos sobre o
      cosmo.
    learnMore:
      - title: NASA, telescópio espacial Hubble
        url: https://science.nasa.gov/mission/hubble/

  - id: james-webb
    level: medium
    prompt: O telescópio James Webb, lançado em 2021, enxerga principalmente que tipo de luz?
    choices:
      - Infravermelha
      - Ultravioleta
      - Raios X
      - Só a luz que os olhos veem
    answer: Infravermelha
    explanation: >-
      A luz infravermelha atravessa nuvens de poeira e mostra galáxias muito antigas e
      distantes. O Webb não fica em volta da Terra: ele está a 1,5 milhão de km daqui, em
      órbita do Sol.
    learnMore:
      - title: NASA, telescópio James Webb
        url: https://science.nasa.gov/mission/webb/

  - id: iss-always-inhabited
    type: true-false
    level: medium
    prompt: Desde novembro de 2000, sempre tem alguém morando na Estação Espacial Internacional.
    answer: true
    explanation: >-
      Há mais de 25 anos, astronautas de vários países se revezam lá em cima, sem pausa.
      Normalmente vivem na estação umas sete pessoas ao mesmo tempo.
    learnMore:
      - title: NASA, a Estação Espacial em números
        url: https://www.nasa.gov/international-space-station/space-station-facts-and-figures/

  - id: pale-blue-dot
    level: medium
    prompt: O que é o "Pálido Ponto Azul", uma foto famosa tirada pela sonda Voyager 1 em 1990?
    choices:
      - A Terra vista de muito longe, como um pontinho
      - Uma estrela recém-descoberta
      - O planeta Netuno
      - Uma galáxia azul
    answer: A Terra vista de muito longe, como um pontinho
    explanation: >-
      Bem longe, já depois de Netuno, a Voyager 1 virou a câmera para trás e fotografou a
      Terra, que apareceu como um pontinho de luz. O astrônomo Carl Sagan deu fama à imagem
      e escreveu sobre como nosso planeta é pequeno e precioso.
    learnMore:
      - title: NASA, Voyager 1
        url: https://science.nasa.gov/mission/voyager/voyager-1/

  - id: amazonia-1
    level: medium
    prompt: O Amazonia-1, lançado em 2021, é o primeiro satélite de observação da Terra feito inteiro no Brasil. Para que ele serve?
    choices:
      - Para transmitir canais de TV
      - Para tirar imagens e ajudar a vigiar o desmatamento
      - Para levar astronautas brasileiros
      - Para estudar Marte
    answer: Para tirar imagens e ajudar a vigiar o desmatamento
    explanation: >-
      O satélite foi desenvolvido pelo INPE, com empresas brasileiras. Suas imagens ajudam a
      acompanhar a floresta amazônica e outros recursos naturais do país.
    learnMore:
      - title: Revista Pesquisa FAPESP, a Amazônia no espaço
        url: https://revistapesquisa.fapesp.br/amazonia-no-espaco/

  - id: first-spacewalk
    level: hard
    prompt: Quem foi a primeira pessoa a sair de uma nave e "caminhar" no espaço, em 1965?
    choices:
      - Neil Armstrong
      - Alexei Leonov
      - Yuri Gagarin
      - John Glenn
    answer: Alexei Leonov
    explanation: >-
      O russo Alexei Leonov ficou uns 12 minutos do lado de fora, preso à nave por um cabo.
      Na volta, o traje tinha inchado e ele quase não passou pela porta: teve que soltar um
      pouco do ar para conseguir entrar.
    learnMore:
      - title: Guinness World Records, 1965, a primeira caminhada espacial
        url: https://www.guinnessworldrecords.com/news/2015/8/60/1965-first-space-walk-392987

  - id: new-horizons
    level: hard
    prompt: Qual sonda tirou as primeiras fotos de perto de Plutão, em 2015?
    choices:
      - New Horizons
      - Voyager 2
      - Hubble
      - Perseverance
    answer: New Horizons
    explanation: >-
      Depois de uma viagem de nove anos, a New Horizons passou por Plutão e mostrou uma
      enorme geleira de nitrogênio em forma de coração na superfície dele.
    learnMore:
      - title: NASA, New Horizons
        url: https://science.nasa.gov/mission/new-horizons/

  - id: rosetta-comet
    level: hard
    prompt: Em 2014, a missão Rosetta, da Agência Espacial Europeia, foi a primeira a pousar um robô onde?
    choices:
      - Num cometa
      - Em Vênus
      - No Sol
      - Num buraco negro
    answer: Num cometa
    explanation: >-
      A Rosetta acompanhou um cometa na viagem em volta do Sol e soltou nele o pequeno robô
      Philae. Foi a primeira vez que uma nave pousou num cometa.
    learnMore:
      - title: Agência Espacial Europeia, a missão Rosetta
        url: https://www.esa.int/Science_Exploration/Space_Science/Rosetta

  - id: moon-far-side-landing
    type: true-false
    level: hard
    prompt: Nenhuma nave jamais pousou no lado da Lua que fica escondido da Terra.
    answer: false
    explanation: >-
      Em 2019, a missão chinesa Chang'e-4 fez o primeiro pouso no lado oculto da Lua e
      soltou o jipe-robô Yutu-2. Como esse lado não "enxerga" a Terra, a comunicação passa
      por um satélite de apoio.
    learnMore:
      - title: The Planetary Society, a missão Chang'e-4
        url: https://www.planetary.org/space-missions/change-4
