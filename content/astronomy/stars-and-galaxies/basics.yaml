title: Estrelas e galáxias
subtopic: Estrelas e galáxias
questions:
  - id: nearest-star
    level: easy
    prompt: Qual é a estrela mais próxima da Terra?
    choices:
      - Sirius
      - Próxima Centauri
      - O Sol
      - Betelgeuse
    answer: O Sol
    explanation: >-
      O Sol está a cerca de 150 milhões de km. Fora ele, a estrela mais próxima é Próxima
      Centauri, a mais de 4 anos-luz daqui.
    learnMore:
      - title: NASA, fatos sobre o Sol
        url: https://science.nasa.gov/sun/facts/
      - title: NASA, a estrela vizinha mais próxima
        url: https://imagine.gsfc.nasa.gov/features/cosmic/nearest_star_info.html

  - id: our-galaxy
    level: easy
    prompt: Como se chama a galáxia onde fica o Sistema Solar?
    choices:
      - Andrômeda
      - Via Láctea
      - Órion
      - Cruzeiro do Sul
    answer: Via Láctea
    explanation: >-
      A Via Láctea tem centenas de bilhões de estrelas. O Sol é só uma delas, num dos
      braços em espiral.
    learnMore:
      - title: NASA, a nossa galáxia, a Via Láctea
        url: https://science.nasa.gov/universe/exoplanets/our-milky-way-galaxy-how-big-is-space/

  - id: light-year
    level: medium
    prompt: O que é um ano-luz?
    choices:
      - Um ano de viagem de uma nave
      - A distância que a luz percorre em um ano
      - Uma estrela muito antiga
      - O tempo que o Sol leva para girar
    answer: A distância que a luz percorre em um ano
    explanation: >-
      É uma medida de distância, não de tempo. Em um ano a luz percorre quase 9,5 trilhões
      de km.
    learnMore:
      - title: NASA Space Place, o que é um ano-luz
        url: https://spaceplace.nasa.gov/light-year/en/

  - id: hottest-color
    level: medium
    prompt: Qual cor indica as estrelas mais quentes?
    choices:
      - Vermelha
      - Amarela
      - Azul
      - Laranja
    answer: Azul
    explanation: >-
      As azuis passam de 10.000 °C na superfície. As vermelhas são as mais frias, com cerca
      de 3.000 °C.
    learnMore:
      - title: NASA, cores e temperaturas das estrelas
        url: https://imagine.gsfc.nasa.gov/ask_astro/stars.html

  - id: supernova
    level: medium
    prompt: Como se chama a explosão de uma estrela gigante no fim da vida?
    choices:
      - Eclipse
      - Aurora
      - Supernova
      - Cometa
    answer: Supernova
    explanation: >-
      A supernova espalha pelo espaço elementos como o ferro e o cálcio, que também estão
      no nosso corpo.
    learnMore:
      - title: NASA, o cálcio vem das estrelas
        url: https://imagine.gsfc.nasa.gov/educators/calcium/got_calcium_litho.html
      - title: Chandra (NASA), supernovas e seus restos
        url: https://chandra.harvard.edu/resources/illustrations/supernova.html

  - id: andromeda
    level: medium
    prompt: Qual grande galáxia vizinha está se aproximando da Via Láctea?
    choices:
      - Andrômeda
      - Sombrero
      - Redemoinho
      - Cata-vento
    answer: Andrômeda
    explanation: >-
      Andrômeda está a 2,5 milhões de anos-luz e vem na nossa direção. Por muito tempo se
      previu uma colisão daqui a 4,5 bilhões de anos, mas medições novas mostraram que isso
      é incerto: dependendo do estudo, a chance de elas se fundirem fica entre 50% e 90%, e
      só deve acontecer daqui a mais de 6 bilhões de anos.
    learnMore:
      - title: NASA, Andrômeda
        url: https://science.nasa.gov/universe/galaxies/andromeda/
      - title: Universidade de Durham, a colisão é mesmo certa?
        url: https://dur.ac.uk/news-events/latest-news/2025/06/new-study-casts-doubt-on-the-likelihood-of-milky-way-collision-with-andromeda/

  - id: shooting-star
    level: easy
    prompt: O que é uma estrela cadente?
    choices:
      - Uma estrela caindo
      - Um pedaço de rocha queimando na atmosfera
      - Um planeta distante
      - Um satélite
    answer: Um pedaço de rocha queimando na atmosfera
    explanation: >-
      É um grão de poeira ou de rocha que queima ao entrar na atmosfera em alta velocidade.
      O nome certo é meteoro.
    learnMore:
      - title: NASA, meteoros e meteoritos
        url: https://science.nasa.gov/solar-system/meteors-meteorites/facts/

  - id: brightest-star
    level: medium
    prompt: Qual é a estrela mais brilhante do céu noturno?
    choices:
      - Polaris, a Estrela Polar
      - Sirius
      - Betelgeuse
      - Vega
    answer: Sirius
    explanation: >-
      Sirius, na constelação do Cão Maior, é a estrela mais brilhante do céu noturno. Ela
      fica a uns 8,6 anos-luz, e na verdade são duas estrelas: a grande e brilhante e uma
      companheira bem fraquinha, a Sirius B, a primeira anã branca descoberta.
    learnMore:
      - title: Britannica, Sirius
        url: https://www.britannica.com/place/Sirius-star
      - title: NASA, Sirius, a estrela mais brilhante da noite
        url: https://science.nasa.gov/image-article/apod-1996-september-02-sirius-the-brightest-star-in-the-night/

  - id: sun-is-star
    type: true-false
    level: easy
    prompt: O Sol é uma estrela.
    answer: true
    explanation: >-
      O Sol é uma estrela como as que vemos à noite, só que muito mais perto. As outras
      parecem pontinhos porque estão tão longe que a luz delas leva anos para chegar aqui.
    learnMore:
      - title: NASA, fatos sobre o Sol
        url: https://science.nasa.gov/sun/facts/

  - id: sun-made-of
    type: fill-blank
    level: easy
    prompt: O Sol é feito principalmente de ___.
    choices:
      - hidrogênio
      - fogo
      - ferro
      - oxigênio
    answer: hidrogênio
    explanation: >-
      O Sol é quase todo hidrogênio e hélio. No centro dele, o hidrogênio vira hélio e
      solta a energia que chega até nós como luz e calor. Não é fogo: não há oxigênio
      queimando.
    learnMore:
      - title: NASA, fatos sobre o Sol
        url: https://science.nasa.gov/sun/facts/

  - id: sun-age
    level: medium
    prompt: Qual é a idade aproximada do Sol?
    choices:
      - 6 mil anos
      - 4,6 milhões de anos
      - 4,6 bilhões de anos
      - 100 bilhões de anos
    answer: 4,6 bilhões de anos
    explanation: >-
      O Sol se formou há uns 4,6 bilhões de anos, a partir de uma nuvem gigante de gás e
      poeira que girava. Os planetas nasceram das sobras dessa mesma nuvem.
    learnMore:
      - title: NASA, fatos sobre o Sol
        url: https://science.nasa.gov/sun/facts/

  - id: southern-cross
    level: easy
    prompt: Qual constelação aparece no centro da bandeira do Brasil?
    choices:
      - Órion
      - Cruzeiro do Sul
      - Escorpião
      - Ursa Maior
    answer: Cruzeiro do Sul
    explanation: >-
      A bandeira mostra o céu do Rio de Janeiro na manhã de 15 de novembro de 1889, dia da
      proclamação da República. O Cruzeiro do Sul é uma constelação que se vê bem do
      hemisfério Sul.
    learnMore:
      - title: Planalto, Lei 5.700, sobre os símbolos nacionais
        url: https://www.planalto.gov.br/ccivil_03/leis/l5700.htm

  - id: flag-stars
    type: fill-blank
    level: medium
    prompt: A bandeira do Brasil tem ___ estrelas.
    choices:
      - '21'
      - '26'
      - '27'
      - '30'
    answer: '27'
    explanation: >-
      Cada estrela representa um estado, e uma representa o Distrito Federal. Quando surge um
      estado novo, a lei manda incluir mais uma estrela no céu da bandeira.
    learnMore:
      - title: Planalto, Lei 5.700, sobre os símbolos nacionais
        url: https://www.planalto.gov.br/ccivil_03/leis/l5700.htm
      - title: Planalto, Lei 8.421, de 1992, que atualizou as estrelas
        url: https://www.planalto.gov.br/ccivil_03/leis/l8421.htm

  - id: twinkling
    level: medium
    prompt: Por que as estrelas parecem piscar no céu?
    choices:
      - Elas acendem e apagam
      - O ar em movimento da Terra desvia a luz delas
      - Os satélites passam na frente
      - Os nossos olhos se cansam
    answer: O ar em movimento da Terra desvia a luz delas
    explanation: >-
      A luz das estrelas atravessa camadas de ar que se mexem e mudam de temperatura, e isso
      a entorta um pouquinho a todo momento. Perto do horizonte, onde há mais ar no caminho,
      elas piscam mais.
    learnMore:
      - title: NASA StarChild, por que as estrelas piscam
        url: https://starchild.gsfc.nasa.gov/docs/StarChild/questions/question26.html

  - id: visible-stars
    level: medium
    prompt: Numa noite limpa e escura, longe das luzes da cidade, mais ou menos quantas estrelas dá para ver a olho nu?
    choices:
      - Umas 60
      - Umas 6.000
      - Umas 6 milhões
      - Todas as estrelas da galáxia
    answer: Umas 6.000
    explanation: >-
      Contando o céu todo, os dois hemisférios, são uns 6 mil. A Via Láctea tem centenas de
      bilhões de estrelas, mas a maioria está longe ou fraca demais para os nossos olhos.
    learnMore:
      - title: NASA StarChild, por que as estrelas piscam
        url: https://starchild.gsfc.nasa.gov/docs/StarChild/questions/question26.html

  - id: big-bang
    level: medium
    prompt: Como se chama a ideia científica de como o universo começou, a partir de um estado muito quente e denso?
    choices:
      - Big Bang
      - Buraco negro
      - Supernova
      - Via Láctea
    answer: Big Bang
    explanation: >-
      Segundo o Big Bang, o universo era quente e denso e vem se expandindo desde então. Não
      foi uma explosão num lugar: foi o próprio espaço que começou a crescer.
    learnMore:
      - title: NASA, visão geral do universo
        url: https://science.nasa.gov/universe/overview/

  - id: universe-age
    level: hard
    prompt: Qual é a idade aproximada do universo?
    choices:
      - 4,6 bilhões de anos
      - 13,8 bilhões de anos
      - 100 bilhões de anos
      - Ele sempre existiu
    answer: 13,8 bilhões de anos
    explanation: >-
      A conta vem da luz mais antiga que existe, um brilho fraquinho que sobrou do começo
      do universo e foi medido por satélites. O Sol, com 4,6 bilhões de anos, chegou bem
      depois.
    learnMore:
      - title: NASA WMAP, qual a idade do universo
        url: https://wmap.gsfc.nasa.gov/universe/uni_age.html

  - id: black-hole
    level: medium
    prompt: O que é um buraco negro?
    choices:
      - Um buraco no espaço vazio
      - Uma região com gravidade tão forte que nem a luz escapa
      - Uma estrela apagada que esfriou
      - Um planeta muito escuro
    answer: Uma região com gravidade tão forte que nem a luz escapa
    explanation: >-
      Muita matéria espremida num espaço pequeno cria uma gravidade enorme. Como nem a luz
      sai, ele não pode ser visto direto, mas dá para notar o que acontece em volta dele.
    learnMore:
      - title: NASA, buracos negros
        url: https://science.nasa.gov/universe/black-holes/

  - id: black-hole-photo
    level: hard
    prompt: Em que ano foi divulgada a primeira imagem de um buraco negro?
    choices:
      - '1969'
      - '1990'
      - '2019'
      - Ainda não existe
    answer: '2019'
    explanation: >-
      A imagem mostra a sombra do buraco negro no centro da galáxia M87, cercada por um anel
      de luz. Para fazê-la, telescópios espalhados pelo mundo trabalharam juntos como se
      fossem um só, do tamanho da Terra.
    learnMore:
      - title: ESO, astrônomos capturam a primeira imagem de um buraco negro
        url: https://www.eso.org/public/news/eso1907/

  - id: neutron-star
    level: hard
    prompt: Um cubinho de açúcar feito do material de uma estrela de nêutrons pesaria, na Terra, mais ou menos quanto?
    choices:
      - 1 quilo
      - 1 tonelada
      - 1 milhão de toneladas
      - 1 bilhão de toneladas
    answer: 1 bilhão de toneladas
    explanation: >-
      Estrelas de nêutrons são o que sobra de estrelas gigantes depois de uma supernova. Elas
      têm mais massa que o Sol espremida numa bola de uns 20 km, do tamanho de uma cidade.
    learnMore:
      - title: NASA, estrelas de nêutrons
        url: https://imagine.gsfc.nasa.gov/science/objects/neutron_stars1.html
